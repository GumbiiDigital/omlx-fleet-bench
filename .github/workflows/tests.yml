name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Pinned on purpose: the ubuntu-26.04 image has no Python 3.9 for
    # setup-python, and the Macs that run this harness use Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Published numbers match the raw rows
        run: python bench/publish.py --check
