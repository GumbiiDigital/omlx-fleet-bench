<svg xmlns="http://www.w3.org/2000/svg" width="840" height="237" viewBox="0 0 840 237" role="img" aria-label="Peak memory by prompt memory setting (GB) Mac B (Flash-Next) · Mac alone, cold cache, mean of 3 runs per bar. Lower is better." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
